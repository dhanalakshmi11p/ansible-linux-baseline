---
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ansible-core ansible-lint yamllint
      - name: YAML lint
        run: yamllint .
      - name: Ansible lint
        run: ansible-lint
      - name: Syntax check
        run: |
          ansible-playbook -i localhost, site.yml --syntax-check
